<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: dark navy matching app dark mode bg -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1821"/>
      <stop offset="1" stop-color="#0F1E2E"/>
    </linearGradient>

    <!-- S stroke: light teal → primary (#0D9488) → lighter again -->
    <linearGradient id="sGrad" x1="20" y1="8" x2="20" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>

    <!-- Glow behind S -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="40" height="40" rx="9" fill="url(#bgGrad)"/>

  <!-- Primary-tinted inner border -->
  <rect x="0.8" y="0.8" width="38.4" height="38.4" rx="8.3"
        stroke="#0D9488" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- Glow layer -->
  <path
    d="M26.5 14C26.5 11 23.5 8.5 20 8.5
       C16.5 8.5 13 10.5 13 14.5
       C13 17.8 17 19.8 20 21
       C23 22.2 27 24.2 27 27.5
       C27 31.5 23 33.5 20 33.5
       C17 33.5 13.5 32 13 29.5"
    stroke="#0D9488"
    stroke-opacity="0.35"
    stroke-width="7"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Main S -->
  <path
    d="M26.5 14C26.5 11 23.5 8.5 20 8.5
       C16.5 8.5 13 10.5 13 14.5
       C13 17.8 17 19.8 20 21
       C23 22.2 27 24.2 27 27.5
       C27 31.5 23 33.5 20 33.5
       C17 33.5 13.5 32 13 29.5"
    stroke="url(#sGrad)"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top anchor dot in light teal (chart-1) -->
  <circle cx="20" cy="8.5" r="2.4" fill="#0D9488"/>
  <circle cx="20" cy="8.5" r="1.2" fill="#5EEAD4"/>
</svg>
